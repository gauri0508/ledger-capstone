{{- if .Values.backend.autoscaling.enabled }}
# Scales the backend on CPU. Needs metrics-server and a CPU *request* on the
# container (utilisation is a percentage of the request, not of the limit).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ledger.backend.fullname" . }}
  labels:
    {{- include "ledger.labels" (dict "root" . "component" "backend") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ledger.backend.fullname" . }}
  minReplicas: {{ .Values.backend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.backend.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.backend.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      # Default is 300s; shorter so a demo scale-down is visible.
      stabilizationWindowSeconds: 60
{{- end }}
