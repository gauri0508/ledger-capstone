apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ledger.backend.fullname" . }}
  labels:
    {{- include "ledger.labels" (dict "root" . "component" "backend") | nindent 4 }}
spec:
  # Set on install so two pods come up straight away. When the HPA later changes
  # it, a helm upgrade does not fight back: Helm 3 patches old-manifest -> new-
  # manifest, and this field only changes if replicaCount does.
  replicas: {{ .Values.backend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "ledger.selectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ledger.selectorLabels" (dict "root" . "component" "backend") | nindent 8 }}
      annotations:
        # Roll the pods whenever config or credentials change.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        {{- toYaml .Values.backend.securityContext | nindent 8 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "ledger.selectorLabels" (dict "root" . "component" "backend") | nindent 20 }}
      initContainers:
        {{- if .Values.backend.waitForPostgres }}
        - name: wait-for-postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ .Values.postgres.service.name }} -p {{ .Values.postgres.service.port }} -U "$POSTGRES_USER"; do
                echo "waiting for postgres..."; sleep 2
              done
          envFrom:
            - secretRef:
                name: {{ include "ledger.secret.name" . }}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
        {{- end }}
        {{- if .Values.backend.migrations.initContainer }}
        # Schema migration runs here, not in the app container. With two
        # replicas starting at once both would otherwise run `alembic upgrade
        # head` at the same instant; the loser fails on the alembic_version
        # table and the pod restarts. In an init container the loser simply
        # retries, sees the schema is already at head, and exits 0.
        - name: migrate
          image: {{ include "ledger.image" (dict "root" . "image" .Values.backend.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command:
            - sh
            - -c
            - |
              until alembic upgrade head; do
                echo "[migrate] alembic failed (another replica is probably migrating), retrying in 3s"; sleep 3
              done
          envFrom:
            - secretRef:
                name: {{ include "ledger.secret.name" . }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
        {{- end }}
      containers:
        - name: backend
          image: {{ include "ledger.image" (dict "root" . "image" .Values.backend.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- if .Values.backend.migrations.initContainer }}
          # Bypass entrypoint.sh (which would migrate again) and just serve.
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*"]
          {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "ledger.configmap.name" . }}
            - secretRef:
                name: {{ include "ledger.secret.name" . }}
          startupProbe:
            httpGet:
              path: {{ .Values.backend.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.backend.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.backend.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
