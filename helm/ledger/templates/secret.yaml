# Credentials, written with stringData so the API server does the base64.
# Both Postgres (POSTGRES_*) and the backend (DATABASE_URL) read this one Secret,
# so the password can only ever be set in one place.
# NOTE: values files are not a secret store - see README for what prod should do.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ledger.secret.name" . }}
  labels:
    {{- include "ledger.labels" (dict "root" . "component" "postgres") | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
  DATABASE_URL: {{ include "ledger.databaseUrl" . | quote }}
