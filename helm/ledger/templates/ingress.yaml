{{- if .Values.ingress.enabled }}
# One hostname for everything. No rewrite annotation: the backend serves
# /api/... itself, and /health /ready /metrics are real backend routes too.
# ingress-nginx picks the longest matching prefix, so /api/* and the exact
# probe paths win over "/" which falls through to the SPA.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ledger.fullname" . }}
  labels:
    {{- include "ledger.labels" (dict "root" . "component" "ingress") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.backend.service.name }}
                port:
                  number: {{ .Values.backend.service.port }}
          {{- range list "/health" "/ready" "/metrics" }}
          - path: {{ . }}
            pathType: Exact
            backend:
              service:
                name: {{ $.Values.backend.service.name }}
                port:
                  number: {{ $.Values.backend.service.port }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.frontend.service.name }}
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
