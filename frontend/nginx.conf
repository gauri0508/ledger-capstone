# Served by nginxinc/nginx-unprivileged, which listens on 8080 and runs as uid 101.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API lives in another container; "backend" resolves via compose / a k8s Service.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Probes and metrics pass through so one hostname tells the whole story.
    location = /health  { proxy_pass http://backend:8000/health; }
    location = /ready   { proxy_pass http://backend:8000/ready; }
    location = /metrics { proxy_pass http://backend:8000/metrics; }

    # Hashed assets can be cached forever; index.html must not be.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths get index.html and React handles the route.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
